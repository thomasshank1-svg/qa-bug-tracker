<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BugLine</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><script defer src="common.js"></script><script defer src="app.js"></script></head><body><header class="topbar"><div><strong>BugLine</strong><span>QA bug tracker</span></div><a href="/">Local demo</a></header><main class="shell"><section class="hero"><p class="badge">QA testing</p><h1>Log bugs, prioritize severity, and verify fixes.</h1><p>A compact QA board for manual test cycles and release cleanup.</p></section><section class="grid"><div class="panel"><div class="panel-title"><h2>Bug board</h2><span id="total"></span></div><div id="bugs" class="list"></div></div><aside class="panel"><form id="bugForm" class="stack"><h2>New bug</h2><label>Title <input name="title" required></label><label>Area <input name="area"></label><label>Severity <select name="severity" id="severity"></select></label><label>Steps <textarea name="steps"></textarea></label><button>Log bug</button></form></aside></section><div id="status" class="status" role="status" aria-live="polite"></div></main></body></html>
